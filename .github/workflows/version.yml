name: Release version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check application version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" public/assets/version.js | head -n 1)
          test "v${APP_VERSION}" = "${RELEASE_TAG}"
