# Runner pin: jobs use ubuntu-24.04, not ubuntu-latest. ubuntu-latest now
# resolves to Ubuntu 26.04, where the Playwright chromium install and the
# Pa11y browser launch fail. Revisit once Playwright supports 26.04.

# Playwright end-to-end and per-state accessibility tests (tests/e2e).
#
# The tests run against the built app served by vite preview (see
# playwright.config.mjs). The transcriber worker is stubbed in the tests, so
# no speech model is downloaded and the tests need no network access beyond
# the dependency install and the Chromium download.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-06-02. The version tag is shown in the trailing comment. To
# update an action, change the SHA and the comment together.
#
# Relationship to accessibility.yml: this workflow covers functional flows
# and visual regression. accessibility.yml covers WCAG conformance via
# Pa11y and axe-core. Both serve different layers and must both be green
# before a PR merges.

name: Playwright
on:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # Chromium only; --with-deps installs system libraries on the runner.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        # Uploaded on failure so it can be inspected without re-running the tests.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
