# Dependabot configuration.
# Weekly, grouped dependency updates. Every directory below exists in this
# repository; add or remove blocks when the project's manifests change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # Held back: see AgentTeam work folder 059-callscribe-dependabot-pr11.
      # Vite 8 build rejects a Latin-1 comment in js-clipper (not valid UTF-8).
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # Held back: see AgentTeam work folder 059-callscribe-dependabot-pr11.
      # transformers 4 changes WebGPU, tokenizers and caching; it needs real
      # audio testing before adoption.
      - dependency-name: "@huggingface/transformers"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /.github/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]
