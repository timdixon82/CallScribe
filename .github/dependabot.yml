# Dependabot configuration.
# Weekly, grouped dependency updates. Every directory below exists in this
# repository; add or remove blocks when the project's manifests change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /.github/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]
